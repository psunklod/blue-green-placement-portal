version: '3.8'

services:
  placement-blue:
    build:
      context: ./app/blue
      dockerfile: Dockerfile
    container_name: placement-portal-blue
    ports:
      - "8081:80"
    restart: always
    environment:
      - APP_ENV=blue
      - APP_VERSION=1.0

  placement-green:
    build:
      context: ./app/green
      dockerfile: Dockerfile
    container_name: placement-portal-green
    ports:
      - "8082:80"
    restart: always
    environment:
      - APP_ENV=green
      - APP_VERSION=2.0
